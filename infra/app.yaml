AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  fin-analyst service: one container-image Lambda behind an IAM-authenticated
  function URL, with jobs and memos in S3. Deployed by deploy/04_app.sh.

Parameters:
  ProjectName:
    Type: String
    Default: fin-analyst
  ImageUri:
    Type: String
  BoundaryArn:
    Type: String
    Description: The permissions boundary from the <project>-iam stack.
  MemorySize:
    Type: Number
    Default: 2048
  TimeoutSeconds:
    Type: Number
    Default: 300 # a memo with retries; far above the ~30-90s typical
  LogRetentionDays:
    Type: Number
    Default: 14
  JobRetentionDays:
    Type: Number
    Default: 90
  AlertEmail:
    Type: String
    Default: ""
    Description: >-
      Where to send alerts. AWS emails a confirmation link once; alerts only
      arrive after it is clicked. Empty means no alerts at all.

Conditions:
  WantsAlerts: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  JobsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-jobs-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldJobs
            Status: Enabled
            Prefix: jobs/
            ExpirationInDays: !Ref JobRetentionDays
          # Filings never change, but a year-old one is rarely the latest; if it
          # is asked for again it is simply downloaded again.
          - Id: ExpireCachedFilings
            Status: Enabled
            Prefix: cache/filings/
            ExpirationInDays: 365
          - Id: ExpireCachedMemos
            Status: Enabled
            Prefix: cache/memos/
            ExpirationInDays: 90
          - Id: ExpireCachedPrices
            Status: Enabled
            Prefix: cache/prices/
            ExpirationInDays: 7
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: project
          Value: !Ref ProjectName

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}"
      RetentionInDays: !Ref LogRetentionDays

  # --- telling someone when it stops working -------------------------------
  # Two things a caller cannot see: the Anthropic account running out of credit
  # (every memo then fails on its first call) and the function itself erroring.

  Alerts:
    Type: AWS::SNS::Topic
    Condition: WantsAlerts
    Properties:
      TopicName: !Sub "${ProjectName}-alerts"
      DisplayName: fin-analyst
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
      Tags:
        - Key: project
          Value: !Ref ProjectName

  AlertsPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: WantsAlerts
    Properties:
      Topics: [!Ref Alerts]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AlarmsMayPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref Alerts
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  # Every run writes its steps to the log as JSON. A run that failed on billing
  # carries the marker llm.py puts in the message, so counting those lines needs
  # no extra code in the function.
  OutOfCreditFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.trace.data.error = "*OUT OF CREDIT*" }'
      MetricTransformations:
        - MetricNamespace: !Ref ProjectName
          MetricName: OutOfCredit
          MetricValue: "1"
          DefaultValue: 0

  OutOfCreditAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WantsAlerts
    Properties:
      AlarmName: !Sub "${ProjectName}-out-of-credit"
      AlarmDescription: >-
        The Anthropic account has no credit left, so every memo fails on its
        first call. Top it up, or turn on auto-reload.
      Namespace: !Ref ProjectName
      MetricName: OutOfCredit
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WantsAlerts
    Properties:
      AlarmName: !Sub "${ProjectName}-function-errors"
      AlarmDescription: >-
        The function itself failed - a crash, a timeout, or a bad deploy. A memo
        that fails for its own reasons is recorded in the job, not here.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProjectName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-function"
      PermissionsBoundary: !Ref BoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${JobsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt JobsBucket.Arn
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
              # To start its own worker. Named, not referenced: a reference to
              # the function would make the role depend on it, and it on the role.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}"

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref ProjectName
      Description: Financial analyst memos. Requests via the IAM function URL; jobs via asynchronous self-invocation.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [x86_64] # no arm64 emulation on the build machine
      MemorySize: !Ref MemorySize
      Timeout: !Ref TimeoutSeconds
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          JOBS_BUCKET: !Ref JobsBucket
          SSM_PREFIX: !Sub "/${ProjectName}"
          EDGAR_LOCAL_DATA_DIR: /tmp/edgar # only /tmp is writable on Lambda
          HOME: /tmp
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # Asynchronous invocations retry twice by default. A retried memo is a second
  # bill for the same work, so a failed job stays failed and says why.
  WorkerRetries:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Function
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 3600

  # AWS_IAM: every request must be signed with credentials of a principal in
  # this account that is allowed to invoke it. Unsigned requests are refused by
  # AWS before the function runs. No resource policy grants anyone else.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: AWS_IAM

Outputs:
  FunctionUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref Function
  BucketName:
    Value: !Ref JobsBucket
  AlertTopic:
    Condition: WantsAlerts
    Description: Confirm the emailed subscription once, or alarms go nowhere.
    Value: !Ref Alerts
