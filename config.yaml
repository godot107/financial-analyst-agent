# Settings for a run. Secrets (API keys) go in .env, not here.

# Each node gets its own model, effort and token ceiling, so one can be tuned
# without touching code. Output tokens cost 5x input and drive latency, so the
# ceilings matter more than anything else here.
nodes:
  plan:
    model: claude-opus-5
    effort: low # picking metrics from a list is an easy task
    max_tokens: 512
  write:
    model: claude-opus-5
    effort: medium
    max_tokens: 1500 # the memo is ~250 words; this is a ceiling, not a target
  verify:
    model: claude-opus-5
    effort: low # judging support against a quoted passage is a reading task
    max_tokens: 1024
  # The interactive Strands chat (docs/STRANDS_PLAN.md): picks its own tools, then
  # writes the answer, so one ceiling covers each of its calls.
  chat_agent:
    model: claude-opus-5
    effort: medium
    max_tokens: 1500

# Where Claude runs. "anthropic" calls the Claude API (today's Lambda stack);
# "bedrock" calls Amazon Bedrock with the machine's AWS credentials or the
# AgentCore Runtime's role (docs/AGENTCORE_PLAN.md). FIN_ANALYST_PROVIDER overrides it.
provider: anthropic

# Used only when provider is bedrock. This AWS account can use only Opus 4.5 and
# Haiku 4.5 on Bedrock (checked 2026-10-29), so each node's model is swapped for
# the one listed under `nodes`; effort and max_tokens stay as set above.
bedrock:
  region: us-east-1
  nodes:
    plan: claude-opus-4-5
    write: claude-opus-4-5
    verify: claude-opus-4-5
    chat_agent: claude-opus-4-5
  # Manual thinking, in tokens, for nodes that don't force a tool (only `write`):
  # Opus 4.5 has no adaptive thinking, and plan/verify force a tool, which thinking
  # can't be combined with. The node's max_tokens is raised by the budget, so the
  # memo keeps its own ceiling. Retry arm after Phase 1 (docs/AGENTCORE_PLAN.md).
  thinking_budget:
    write: 2048
  # id: the cross-region (global) inference profile, called when profile_env is unset.
  # profile_env: names the variable holding a tagged application inference profile
  #   ARN (CloudFormation sets it on the Runtime), so spend is tagged project=fin-analyst.
  # effort / strict_tools / thinking: what the model supports there. Opus 4.5 has no
  #   adaptive thinking, and thinking can't be combined with a forced tool, so
  #   thinking stays off on Bedrock. Confirmed by scripts/bedrock_probe.py.
  models:
    claude-opus-4-5:
      id: global.anthropic.claude-opus-4-5-20251101-v1:0
      profile_env: FIN_ANALYST_PROFILE_OPUS_4_5
      effort: true
      strict_tools: true
    claude-haiku-4-5:
      id: global.anthropic.claude-haiku-4-5-20251001-v1:0
      profile_env: FIN_ANALYST_PROFILE_HAIKU_4_5
      effort: false
      strict_tools: true

# Return a summary of each call's thinking, for the trace (--verbose, the run
# record, and the API's job result). Billing is the same either way: thinking is
# charged in full whether or not a summary comes back.
thinking_summaries: true

# USD per million tokens. Check https://platform.claude.com/docs/en/pricing
# before changing, and add a row before pointing a node at a new model.
prices_per_million_tokens:
  claude-opus-5:
    input: 5.00
    output: 25.00
  claude-sonnet-5:
    input: 2.00
    output: 10.00
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
  # Bedrock, global inference profiles (Price List API, 2026-10-07); us. profiles
  # cost 10% more. Haiku 4.5 is the same price on both.
  claude-opus-4-5:
    input: 5.00
    output: 25.00

# A runaway guard, not a budget. A memo should cost a few cents; if a run passes
# this, something is wrong and it stops.
max_usd_per_run: 1.00

# How many more times `write` may try after `check` finds problems in a draft.
max_retries: 2

# Follow-up questions in `--chat`. Each turn resends the previous answers, so
# cost grows with the conversation. 5 is a hard ceiling in code, not just here.
chat_max_turns: 5

# Tool calls the Strands chat agent may make per question, retries included. Past
# this, a call is cancelled and the agent is told to answer with what it has.
chat_max_tool_calls: 8

# The HTTP service (fin_analyst/service.py). Caps are checked when a job is
# submitted, before any Claude call: an open endpoint is an open tab.
api:
  per_key_daily_usd: 1.00
  global_daily_usd: 3.00
