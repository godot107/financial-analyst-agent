# The gold set: questions whose right answers were checked by hand against the 10-Ks.
#
# Every figure below was found in the filing's own text (the statements or their
# notes), not copied from this tool's extraction, and `evidence` quotes the line.
# Figures are $ millions for the latest fiscal year in that 10-K.
#
#   python evals/gold.py --free    # figures and ratios only: SEC data, no model, $0
#   python evals/gold.py           # the full workflow for every question (~$0.50)
#
# Filings (latest 10-K when checked, 2026-09-16):
#   MSFT 0001193125-26-323660  year ended 2026-06-30
#   COST 0000909832-25-000101  year ended 2025-08-31
#   AAPL 0000320193-25-000079  year ended 2025-09-27
#   JPM  0001628280-26-008131  year ended 2025-12-31
# A newer 10-K changes the answers: the free run reports that as an accession mismatch.

