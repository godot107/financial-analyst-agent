# Ratios to check against the gold facts above, per company. Each is recomputed
# from those hand-checked figures, so a wrong tag or formula shows up here.
ratios:
  current_ratio: [MSFT, COST, AAPL]
  operating_margin: [MSFT, COST, AAPL]
  interest_coverage: [MSFT, COST]
  debt_to_equity: [AAPL]
  debt_to_equity_with_leases: [AAPL]
  roe: [MSFT, COST, AAPL, JPM]
  equity_multiplier: [JPM]

# Questions for the full run. Each grades the plan (which ratios were chosen), the
# memo's existence, retries, the claim checks, and what the memo must or must not say.
questions:
  - ticker: MSFT
    question: How liquid is Microsoft?
    choose_any: [[current_ratio, quick_ratio, cash_flow_ratio]]
    memo_excludes: ["Microsoft 365"]  # the first Lambda memo cited revenue passages here
  - ticker: MSFT
    question: How leveraged is Microsoft once leases are counted?
    choose_any: [[debt_to_equity_with_leases]]
  - ticker: MSFT
    question: Can Microsoft cover its interest payments?
    choose_any: [[interest_coverage]]
  - ticker: MSFT
    question: What is driving Microsoft's return on equity?
    choose_any: [[roe, roe_average_equity], [net_margin], [asset_turnover], [equity_multiplier]]
  - ticker: COST
    question: How liquid is Costco?
    choose_any: [[current_ratio, quick_ratio, cash_flow_ratio]]
  - ticker: COST
    question: How has Costco's leverage changed over the last few years, counting leases?
    filings: 3
    choose_any: [[debt_to_equity_with_leases]]
    min_years: 4  # three 10-Ks carry four balance sheets
  - ticker: AAPL
    question: Can Apple cover its interest expense?
    choose_any: [[interest_coverage]]
    memo_includes_any: ["not available"]  # latest years have no interest expense line
  - ticker: AAPL
    question: How profitable is Apple?
    choose_any: [[gross_margin, operating_margin, net_margin, roe, roe_average_equity]]
  - ticker: JPM
    question: How liquid is JPMorgan?
    memo_includes_any: ["doesn't apply", "does not apply", "not available"]
  - ticker: JPM
    question: What return on equity does JPMorgan earn?
    choose_any: [[roe, roe_average_equity]]
